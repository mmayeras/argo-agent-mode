# "New" app: PULL through the agent. Rendered once per spoke (__SPOKE__) by scripts/05-apps.sh.
# - label argocd-agent=true         -> the principal picks it up and sends it to the agent
# - destination __SPOKE__-agent     -> secret WITH skip-reconcile -> the hub controller ignores it
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-agent-__SPOKE__
  namespace: argocd
  labels:
    argocd-agent: "true"
spec:
  project: agent-apps
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    targetRevision: HEAD
    path: guestbook
  destination:
    name: __SPOKE__-agent
    namespace: guestbook-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
