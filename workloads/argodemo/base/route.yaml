# TLS terminated at the router (edge). insecureEdgeTerminationPolicy: Allow keeps plain http working too.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: argodemo
  labels:
    app: argodemo
spec:
  to:
    kind: Service
    name: argodemo
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
