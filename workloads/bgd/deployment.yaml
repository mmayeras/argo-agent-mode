# bgd sample app (blue square on a web page). Runs non-root on 8080: fits the restricted-v2 SCC.
# No namespace here: each Application puts it in its own destination namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgd
  labels:
    app: bgd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgd
  template:
    metadata:
      labels:
        app: bgd
    spec:
      containers:
        - name: bgd
          image: quay.io/rhdevelopers/bgd:1.0.0
          env:
            - name: COLOR
              value: blue
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
