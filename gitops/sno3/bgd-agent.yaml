# "New" app: PULL through the agent. Child of the root app (labs/05-apps.md).
# - label argocd-agent=true         -> the principal picks it up and sends it to the agent
# - destination sno3-agent -> secret WITH skip-reconcile -> the hub controller ignores it
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-agent-sno3
  namespace: argocd
  labels:
    argocd-agent: "true"
spec:
  project: agent-apps
  source:
    # bgd sample: runs non-root on 8080 (restricted-v2 SCC). Its base hardcodes namespace "bgd":
    # kustomize.namespace overrides it, so each app keeps its own namespace.
    repoURL: https://github.com/redhat-developer-demos/openshift-gitops-examples
    targetRevision: main
    path: apps/bgd/base
    kustomize:
      namespace: bgd-agent
  destination:
    name: sno3-agent
    namespace: bgd-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
