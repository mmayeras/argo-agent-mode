# App that starts as PUSH and will be migrated to the agent (labs/07-demo-migrate.md).
# Child of the root app (labs/05-apps.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-migrate-sno3
  namespace: argocd
spec:
  project: default
  source:
    # bgd sample: runs non-root on 8080 (restricted-v2 SCC). Its base hardcodes namespace "bgd":
    # kustomize.namespace overrides it, so each app keeps its own namespace.
    repoURL: https://github.com/redhat-developer-demos/openshift-gitops-examples
    targetRevision: main
    path: apps/bgd/base
    kustomize:
      namespace: bgd-migrate
  destination:
    name: sno3-direct
    namespace: bgd-migrate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
