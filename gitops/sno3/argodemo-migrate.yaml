# App that starts as PUSH and will be migrated to the agent (labs/07-demo-migrate.md).
# Child of the root app (labs/05-apps.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argodemo-migrate-sno3
  namespace: argocd
  # deleting the app (or pruning it from the root app) also deletes its workloads
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # argodemo from this repo (workloads/argodemo). Overlay = page color: blue (steelblue) or green (seagreen).
    # Fork: change repoURL like GIT_REPO in env.sh.
    repoURL: https://github.com/mmayeras/argo-agent-mode.git
    targetRevision: main
    path: workloads/argodemo/overlays/blue
  destination:
    name: sno3-direct
    namespace: argodemo-migrate
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The spoke Argo CD (OpenShift GitOps) can only write in namespaces labeled managed-by=argocd:
    # the operator then creates an admin Role for it there. First sync may be forbidden until then: retry.
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: argocd
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
