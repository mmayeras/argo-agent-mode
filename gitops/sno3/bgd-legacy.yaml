# "Legacy" app: classic PUSH. Child of the root app (labs/05-apps.md).
# - no argocd-agent label           -> invisible to the principal
# - destination sno3-direct -> secret WITHOUT skip-reconcile -> managed by the hub controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-legacy-sno3
  namespace: argocd
spec:
  project: default
  source:
    # bgd sample: runs non-root on 8080 (restricted-v2 SCC). Its base hardcodes namespace "bgd":
    # kustomize.namespace overrides it, so each app keeps its own namespace.
    repoURL: https://github.com/redhat-developer-demos/openshift-gitops-examples
    targetRevision: main
    path: apps/bgd/base
    kustomize:
      namespace: bgd-legacy
  destination:
    name: sno3-direct
    namespace: bgd-legacy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
