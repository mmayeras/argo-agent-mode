# "Legacy" app: classic PUSH. Child of the root app (labs/05-apps.md).
# - no argocd-agent label           -> invisible to the principal
# - destination sno3-direct -> secret WITHOUT skip-reconcile -> managed by the hub controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-legacy-sno3
  namespace: argocd
  # deleting the app (or pruning it from the root app) also deletes its workloads
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # bgd sample from this repo (workloads/bgd). Fork: change repoURL like GIT_REPO in env.sh.
    repoURL: https://github.com/mmayeras/argo-agent-mode.git
    targetRevision: main
    path: workloads/bgd
  destination:
    name: sno3-direct
    namespace: bgd-legacy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
