# "Legacy" app: classic PUSH. Child of the root app (labs/05-apps.md).
# - no argocd-agent label           -> invisible to the principal
# - destination sno3-direct -> secret WITHOUT skip-reconcile -> managed by the hub controller
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-legacy-sno3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps
    targetRevision: HEAD
    path: guestbook
  destination:
    name: sno3-direct
    namespace: guestbook-legacy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
