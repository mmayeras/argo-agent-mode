# "New" app: PULL through the agent. Child of the root app (labs/05-apps.md).
# - label argocd-agent=true         -> the principal picks it up and sends it to the agent
# - destination sno2-agent -> secret WITH skip-reconcile -> the hub controller ignores it
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bgd-agent-sno2
  namespace: argocd
  # deleting the app (or pruning it from the root app) also deletes its workloads
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    argocd-agent: "true"
spec:
  project: agent-apps
  source:
    # bgd sample from this repo (workloads/bgd). Fork: change repoURL like GIT_REPO in env.sh.
    repoURL: https://github.com/mmayeras/argo-agent-mode.git
    targetRevision: main
    path: workloads/bgd
  destination:
    name: sno2-agent
    namespace: bgd-agent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The spoke Argo CD (OpenShift GitOps) can only write in namespaces labeled managed-by=argocd:
    # the operator then creates an admin Role for it there. First sync may be forbidden until then: retry.
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: argocd
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
